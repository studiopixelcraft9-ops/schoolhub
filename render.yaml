databases:
  - name: schoolhub-db
    plan: free
    databaseName: schoolhub
    user: schoolhub

services:
  - type: web
    name: schoolhub
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn Home.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolhub-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: RENDER
        value: true
