<style>
    .delete-trigger {
        border: 0;
        background: transparent;
        color: #dc2626;
        padding: 0;
        font: inherit;
        cursor: pointer;
    }
    .delete-trigger:hover { color: #b91c1c; text-decoration: underline; }
    .delete-modal[hidden] { display: none; }
    .delete-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(30, 27, 75, .38);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
    .delete-modal__card {
        width: min(100%, 430px);
        padding: 30px;
        border: 1px solid rgba(255, 255, 255, .75);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(49, 46, 129, .3);
        text-align: center;
    }
    .delete-modal__icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #fee2e2;
        color: #dc2626;
        font-size: 28px;
        font-weight: 700;
    }
    .delete-modal h2 { margin: 0; color: #1e1b4b; font-size: 23px; }
    .delete-modal p { margin: 10px 0 24px; color: #64748b; line-height: 1.5; }
    .delete-modal__actions { display: flex; gap: 10px; }
    .delete-modal__actions button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }
    .delete-modal__cancel { background: #f1f5f9; color: #475569; }
    .delete-modal__confirm { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
    .delete-modal__confirm:hover { filter: brightness(.96); }
</style>

<div class="delete-modal" id="delete-modal" hidden aria-hidden="true">
    <div class="delete-modal__card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="delete-modal__icon" aria-hidden="true">!</div>
        <h2 id="delete-modal-title">Delete record?</h2>
        <p id="delete-modal-message">This action cannot be undone.</p>
        <form id="delete-modal-form" method="post">
            {% csrf_token %}
            <div class="delete-modal__actions">
                <button class="delete-modal__cancel" type="button" data-delete-cancel>Cancel</button>
                <button class="delete-modal__confirm" type="submit">Yes, delete</button>
            </div>
        </form>
    </div>
</div>
<script>
    (() => {
        const modal = document.getElementById('delete-modal');
        const form = document.getElementById('delete-modal-form');
        const message = document.getElementById('delete-modal-message');
        if (!modal || !form || !message) return;
        const close = () => { modal.hidden = true; modal.setAttribute('aria-hidden', 'true'); };
        document.querySelectorAll('[data-delete-url]').forEach((trigger) => {
            trigger.addEventListener('click', () => {
                form.action = trigger.dataset.deleteUrl;
                message.textContent = trigger.dataset.deleteMessage || 'This action cannot be undone.';
                modal.hidden = false;
                modal.setAttribute('aria-hidden', 'false');
                modal.querySelector('.delete-modal__cancel').focus();
            });
        });
        modal.addEventListener('click', (event) => { if (event.target === modal) close(); });
        modal.querySelector('[data-delete-cancel]').addEventListener('click', close);
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !modal.hidden) close(); });
    })();
</script>
