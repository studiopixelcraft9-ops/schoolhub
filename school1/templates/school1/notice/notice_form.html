<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 32px; background: #f4f6f8; color: #1f2933; }
        .page { max-width: 640px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
        form p { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #bcccdc; border-radius: 6px; box-sizing: border-box; }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        button, .link { padding: 10px 16px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; font-size: 14px; }
        button { background: #6d5dfc; color: #ffffff; }
        .link { background: #d9e2ec; color: #102a43; }
    </style>
</head>
<body>
    <div class="page">
        <h1>{{ title }}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Save</button>
                <a class="link" href="{% url 'notice_list' %}">Back</a>
            </div>
        </form>
    </div>
</body>
</html>
