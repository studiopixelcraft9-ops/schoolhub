<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><style>body{font-family:Arial,sans-serif;margin:0;padding:32px;background:#f4f6f8;color:#1f2933}.page{max-width:760px;margin:auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.08)}p{margin:0 0 16px}label{display:block;font-weight:bold;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}textarea{min-height:80px}.actions{display:flex;gap:12px;margin-top:22px}button,.link{padding:10px 16px;border:0;border-radius:6px;background:#6d5dfc;color:#fff;text-decoration:none;cursor:pointer;font-size:14px}.link{background:#d9e2ec;color:#102a43}.errorlist{color:#b42318}</style></head><body><div class="page"><h1>{{ title }}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<div class="actions"><button type="submit">Save Employee</button><a class="link" href="{% url 'employee_list' %}">Cancel</a></div></form></div></body></html>
